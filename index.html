<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razaullah Fan's | Pakistan Cricket Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Arial,sans-serif;
background:#06120d;
color:white;
line-height:1.6
}
header{
position:sticky;
top:0;
z-index:1000;
background:rgba(4,20,14,.95);
backdrop-filter:blur(12px);
border-bottom:1px solid #20e091
}
nav{
max-width:1200px;
margin:auto;
padding:16px 20px;
display:flex;
align-items:center;
justify-content:space-between
}
.logo{
font-size:23px;
font-weight:900;
color:#20e091
}
.logo span{color:white}
.links a{
color:white;
text-decoration:none;
margin-left:18px;
font-size:14px
}
.links a:hover{color:#20e091}

.hero{
min-height:620px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:70px 20px;
background:
radial-gradient(circle at 50% 20%,#087b45 0,#04351f 35%,#06120d 75%)
}
.badge{
display:inline-block;
padding:8px 16px;
border-radius:30px;
background:#0b2d20;
border:1px solid #20e091;
color:#20e091;
font-weight:bold;
font-size:13px
}
.hero h1{
font-size:58px;
line-height:1.1;
margin:22px 0 15px
}
.hero h1 span{color:#20e091}
.hero p{
max-width:650px;
margin:auto;
color:#b9c9c1;
font-size:18px
}
.btn{
display:inline-block;
margin-top:30px;
padding:14px 28px;
border-radius:30px;
background:#20e091;
color:#03100a;
font-weight:bold;
text-decoration:none;
box-shadow:0 0 25px #20e09155
}

.container{
max-width:1200px;
margin:auto;
padding:65px 20px
}
.title{
font-size:30px;
margin-bottom:25px
}
.title span{color:#20e091}

.score{
background:linear-gradient(145deg,#0b2d20,#092019);
border:1px solid #176b45;
border-radius:22px;
padding:28px;
text-align:center;
box-shadow:0 15px 40px #0007
}
.live{
display:inline-block;
background:#e33440;
padding:5px 13px;
border-radius:20px;
font-size:12px;
font-weight:bold
}
.score h2{
margin:12px 0;
font-size:42px;
color:#20e091
}
.score p{color:#b9c9c1}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}
.card{
background:linear-gradient(145deg,#09251a,#061a12);
border:1px solid #176b45;
border-radius:20px;
padding:25px;
transition:.3s
}
.card:hover{
transform:translateY(-6px);
border-color:#20e091
}
.card h3{color:#20e091;margin-bottom:10px}
.card p{color:#b9c9c1}

.match{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
border-bottom:1px solid #194b37
}
.match:last-child{border:0}
.team{font-weight:bold}
.vs{color:#20e091;font-weight:bold}

.banner{
margin-top:25px;
padding:45px 25px;
border-radius:25px;
text-align:center;
background:linear-gradient(120deg,#087b45,#06351f);
border:1px solid #20e091
}
.banner h2{font-size:34px}
.banner p{color:#d5eee2;margin-top:8px}

footer{
background:#030b07;
border-top:1px solid #174d36;
text-align:center;
padding:35px 20px;
color:#91a89d
}
footer strong{color:#20e091}

@media(max-width:800px){
.links{display:none}
.hero h1{font-size:42px}
.grid{grid-template-columns:1fr}
}
</style>
</head
