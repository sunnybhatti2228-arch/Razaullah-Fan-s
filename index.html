<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razaullah Fan's | Pakistan Cricket</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, sans-serif;
  background:#06120d;
  color:white;
  line-height:1.6;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(4,20,14,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #19d879;
}

nav{
  max-width:1200px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#20e091;
}

.logo span{
  color:white;
}

.links a{
  color:white;
  text-decoration:none;
  margin-left:18px;
  font-size:14px;
}

.links a:hover{
  color:#20e091;
}

.hero{
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  background:
  radial-gradient(circle at 50% 20%,#087b45 0%,#04351f 35%,#06120d 75%);
}

.hero-content{
  max-width:800px;
}

.badge{
  display:inline-block;
  padding:9px 18px;
  border-radius:30px;
  background:#0b2d20;
  border:1px solid #20e091;
  color:#20e091;
  font-size:13px;
  font-weight:bold;
  margin-bottom:20px;
}

.hero h1{
  font-size:58px;
  line-height:1.1;
  margin-bottom:20px;
}

.hero h1 span{
  color:#20e091;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:#b9c9c1;
  font-size:18px;
}

.buttons{
  margin-top:32px;
}

.btn{
  display:inline-block;
  padding:14px 24px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  margin:6px;
}

.primary{
  background:#20e091;
  color:#03120b;
}

.secondary{
  border:1px solid #20e091;
  color:#20e091;
}

section{
  max-width:1200px;
  margin:auto;
  padding:70px 20px;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:34px;
}

.title p{
  color:#91a59b;
  margin-top:7px;
}

.score-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.score-card{
  background:linear-gradient(145deg,#0d281c,#091a13);
  border:1px solid #174d35;
  border-radius:18px;
  padding:25px;
}

.live{
  color:#20e091;
  font-weight:bold;
  font-size:13px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0;
}

.team{
  text-align:center;
}

.team-name{
  font-size:18px;
  font-weight:bold;
}

.score{
  font-size:34px;
  font-weight:900;
  margin-top:8px;
}

.vs{
  color:#789084;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#0b1d15;
  border:1px solid #173b2b;
  border-radius:16px;
  padding:25px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#20e091;
}

.card-icon{
  font-size:35px;
  margin-bottom:12px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:#91a59b;
}

.news{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.news-card{
  overflow:hidden;
  background:#0b1d15;
  border:1px solid #173b2b;
  border-radius:16px;
}

.news-top{
  height:150px;
  background:
  radial-gradient(circle at center,#0e8b4d,#052817);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.news-content{
  padding:20px;
}

.news-content small{
  color:#20e091;
}

.news-content h3{
  margin:8px 0;
}

.news-content p{
  color:#91a59b;
}
